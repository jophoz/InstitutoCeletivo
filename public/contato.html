<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato — Instituto Celetivo</title>
  <link rel="icon" type="image/png" href="/assets/favicon/favicon.png">
  <meta name="description" content="Fale com o Instituto Celetivo por e-mail: dúvidas sobre cursos, compras, acesso e suporte.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preload" href="/fonts/inter/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/source-serif-4/SourceSerif4Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/theme.js"></script>
  <script src="data/site.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/track.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="contato">
<noscript><div class="noscript-banner" role="alert"><strong>JavaScript desativado.</strong> Este site precisa do JavaScript para mostrar o menu, os produtos e o rodapé. Ative-o nas configurações do navegador e recarregue a página.</div></noscript>
<svg class="svg-sprite" aria-hidden="true">
</svg>
<div id="site-header"></div>
<main id="conteudo">
  <section class="v-hero page-hero" aria-labelledby="t-contato">
    <div class="container">
      <h1 id="t-contato">Fale com a gente</h1>
      <p class="lead">Dúvidas sobre um curso, uma compra ou o acesso: mande um e-mail. Respondemos em dias úteis.</p>
    </div>
  </section>
  <section class="v-section is-light" aria-label="E-mail de contato">
    <div class="container">
      <!-- Cartões montados por main.js a partir de SITE.contato (data/site.js) -->
      <ul id="contato-links" class="contact-cards"></ul>
      <p class="muted contact-note">Se a dúvida for sobre uma compra, informe o e-mail usado no pagamento. Antes de escrever, vale olhar as <a href="/duvidas.html">dúvidas frequentes</a>.</p>
    </div>
  </section>
</main>
<div id="site-footer"></div>
</body>
</html>
