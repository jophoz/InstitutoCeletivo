<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sobre — Instituto Celetivo</title>
  <link rel="icon" type="image/png" href="/assets/favicon/favicon.png">
  <meta name="description" content="O que é o Instituto Celetivo, que tipo de material você encontra e como funcionam a compra e o acesso.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preload" href="/fonts/inter/InterVariable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/source-serif-4/SourceSerif4Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/site.css">
  <script src="js/theme.js"></script>
  <script src="data/site.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/track.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body data-page="sobre">
<noscript><div class="noscript-banner" role="alert"><strong>JavaScript desativado.</strong> Este site precisa do JavaScript para mostrar o menu, os produtos e o rodapé. Ative-o nas configurações do navegador e recarregue a página.</div></noscript>
<div id="site-header"></div>
<main id="conteudo">
  <section class="v-hero page-hero" aria-labelledby="t-sobre">
    <div class="container">
      <h1 id="t-sobre" data-site="nome">Instituto Celetivo</h1>
      <p class="lead" data-site="sobre.subtitulo"></p>
    </div>
  </section>
  <section class="v-section is-light" aria-labelledby="t-quem-somos">
    <div class="container narrow about-text">
      <h2 id="t-quem-somos" data-site="sobre.titulo"></h2>
      <div id="sobre-texto"></div>
    </div>
  </section>
  <section class="v-section is-dark" id="professor" aria-labelledby="t-professor" hidden>
    <div class="container about">
      <div id="foto-professor" class="photo"></div>
      <div>
        <h2 id="t-professor" data-site="professor.nome"></h2>
        <p class="muted"><strong data-site="professor.cargo"></strong></p>
        <p data-site="professor.bio"></p>
      </div>
    </div>
  </section>
  <section class="v-strip" aria-labelledby="t-explore">
    <div class="container v-strip-row">
      <div>
        <p class="v-eyebrow" id="t-explore">Catálogo</p>
        <p class="v-strip-text" data-site="sobre.chamada.destaque"></p>
        <p class="v-strip-sub" data-site="sobre.chamada.texto"></p>
      </div>
      <div class="v-strip-action"><a class="btn-cta" href="/catalogo">Ver todos os cursos</a></div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
</body>
</html>
